name: Build Claudio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FREE_API_KEY: ${{ secrets.FREE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk claudio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudio-apk
          path: claudio.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Claudio v1.3.${{ github.run_number }}
          body: |
            Installable Android build of Claudio — made by poging kyle.

            **Install:** download `claudio.apk` below on your Android phone, open it, and allow installation from your browser/files app when prompted. Requires Android 8.0+.

            **Setup:** none. Claudio Free works out of the box with the built-in key. Add your own key in Settings → Connection whenever you want, and switch back to free at any time.
          files: claudio.apk