name: Build Claudio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudio-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Claudio v1.0.${{ github.run_number }}
          body: |
            Installable Android build of Claudio.

            **Install:** download `app-debug.apk` below on your Android phone, open it, and allow installation from your browser/files app when prompted. Requires Android 8.0+.

            **Setup:** paste your OpenRouter API key (get one at https://openrouter.ai/keys) on first launch. Your key stays on your device.
          files: app/build/outputs/apk/debug/app-debug.apk